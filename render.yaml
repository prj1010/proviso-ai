# Render Blueprint for Proviso.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: proviso-ai
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    # Also works if the dashboard still has the old command `npm ci && npm run build`.
    # Vite and Nitro are production dependencies, so NODE_ENV=production does not skip them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: NITRO_HOST
        value: 0.0.0.0
      # Voice and harder lease answers. Set this in the Render dashboard.
      - key: GROQ_API_KEY
        sync: false
      # Optional. Jev is secondary and not required. TypeSafe is not accepting new keys.
      - key: TYPESAFE_API_KEY
        sync: false
